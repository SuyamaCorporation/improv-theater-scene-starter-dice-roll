<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>即興演劇シーンスターターダイスロール</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen p-4">
<div class="max-w-2xl mx-auto">
  <h1 class="text-2xl font-bold text-center text-teal-400 mb-1">🎭 即興演劇シーンスターター</h1>
  <p class="text-center text-gray-400 text-sm mb-6">ダイスロールでシーン設定をランダム生成</p>

  <button onclick="rollAll()" class="w-full bg-teal-600 hover:bg-teal-500 text-white font-bold py-4 rounded-xl mb-5 transition text-lg" aria-label="全要素を一括ロール">
    🎲 全要素を一括ロール
  </button>

  <!-- Scene Cards -->
  <div class="grid grid-cols-1 gap-3 mb-5" id="scene-cards">
    <!-- Generated by JS -->
  </div>

  <!-- History & Favorites -->
  <div class="grid grid-cols-1 gap-4">
    <div class="bg-gray-800 rounded-xl p-4">
      <div class="flex justify-between items-center mb-3">
        <h2 class="text-lg font-semibold text-teal-300">★ お気に入りシーン</h2>
        <button onclick="clearFavs()" class="text-xs text-gray-500 hover:text-red-400" aria-label="クリア">クリア</button>
      </div>
      <div id="favs-list" class="space-y-2 text-sm text-gray-400">保存なし</div>
    </div>
  </div>

  <!-- Edit Modal -->
  <div id="edit-modal" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center p-4" role="dialog" aria-label="リスト編集">
    <div class="bg-gray-800 rounded-xl p-5 max-w-md w-full">
      <h3 class="font-semibold mb-3 text-teal-300" id="edit-title"></h3>
      <textarea id="edit-area" class="w-full bg-gray-700 rounded p-2 text-sm h-48 resize-none focus:outline-none focus:border-teal-400 border border-gray-600" aria-label="リスト編集テキストエリア"></textarea>
      <div class="flex gap-2 mt-3">
        <button onclick="saveEdit()" class="flex-1 bg-teal-600 hover:bg-teal-500 rounded py-2 text-sm text-white" aria-label="保存">保存</button>
        <button onclick="document.getElementById('edit-modal').classList.add('hidden')" class="px-4 bg-gray-600 hover:bg-gray-500 rounded py-2 text-sm text-white" aria-label="閉じる">キャンセル</button>
      </div>
    </div>
  </div>
</div>

<script>
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
const ELEMENTS = {
  where: {
    label: '場所 (Where)',
    icon: '📍',
    color: 'teal',
    items: ['地下鉄の終点駅','廃墟になった遊園地','深夜の病院の廊下','嵐の中の灯台','宇宙ステーションの食堂','砂漠のオアシス','城の屋根裏部屋','漁港の早朝市場','ジャングルの探検基地','老人ホームの食堂','廃工場の屋上','温泉旅館の大浴場','宇宙船の脱出ポッド内','海底の研究施設','山頂の気象観測所','タイムマシンの中','魔法学校の図書館','砂嵐の中のテント','真夜中の病院屋上','廃線になった電車内','怪しい骨董品店','深夜のコンビニ','廃坑の奥','竜の巣穴','未来の刑務所','霧に包まれた港','高級レストランのキッチン','廃城の地下牢','宇宙港の出国審査','砂漠の廃墟の神殿','川岸の橋の下','遠征隊のベースキャンプ','飛行船の客室','消えた村の広場','海底神殿','未来都市のスラム街','古代遺跡の中心','密林の川の中洲','革命前夜の地下室','極夜のツンドラ','孤島の灯台守小屋','虚空に浮かぶ島','砂漠の王の宮殿','炎上中の船','真夜中の公園','戦場の野戦病院','爆発寸前の火山','溶け落ちる洞窟','嵐の中の島','極寒の研究基地'],
  },
  who: {
    label: '職業 (Who)',
    icon: '👤',
    color: 'blue',
    items: ['閉店間際の花屋の店主','ランニング中の元プロ選手','宇宙飛行士の訓練生','廃業した手品師','怪しい香辛料商人','世界一退屈な探偵','記憶を失った教師','島で唯一の医師','未来から来たエンジニア','廃業した道化師','元海賊船の船医','宮廷の道化師','竜を育てた農夫','タイムトラベラーの案内人','廃れた神殿の僧侶','元スパイの菓子職人','砂漠のキャラバン隊長','宇宙港の密輸業者','記憶を売る占い師','竜の最後の騎士','廃工場の用心棒','廃墟の街の市長','島を去ろうとしている灯台守','未知の病気の研究者','引退した殺し屋','惑星間移民のブローカー','遺産を探す考古学者','元宮廷料理人','廃業した武器職人','廃れた町の最後の住人','タイムカプセルを埋めた老人','流れ者の刀鍛冶','旅芸人の一座のリーダー','廃園の庭師','惑星探索隊の隊長','炎使いの見習い','宇宙航海士','廃宿の最後の宿泊客','砂漠の盗賊団の若頭','怪しい薬売り','廃れた競馬場の馬主','孤島の発明家','廃校の最後の生徒','廃線に乗る一人旅の老人','怪しい商船の一等航海士','未来の予言者','滅びた王国の最後の兵士','戦場の一般市民','元気象予報士','廃れた宿場町の駅馬車御者'],
  },
  relationship: {
    label: '二人の関係 (Relationship)',
    icon: '🤝',
    color: 'purple',
    items: ['初対面（絶対合わない二人）','昔の親友で再会','元恋人（別れ方が最悪）','師弟関係（立場が逆転）','ライバル（互いを認め合えない）','全く知らない他人のふりをしている親子','同じ記憶を持つが初対面','共通の秘密を持つ他人','お互いが相手を騙している','昔救った・救われた関係','同じ夢を持つ元同僚','互いに好きだと気づいていない二人','お互い嫌いだが助け合う','昨日の敵・今日の味方','偶然の一致で入れ替わった二人','一方が記憶を失っている','互いに相手が死んだと思っている','昔の賭けの結果が今頃効いてくる','同一人物の過去と未来','一方が双子のもう一人を探している','互いに相手をスパイだと思っている','二人とも今日が誕生日','同じ本を書いたと主張している','共通の秘密組織の元メンバー','一方が相手を守るために嘘をついている','共犯者','お互いがお互いの幽霊だと思っている','一方が相手の未来を知っている','昔の賭けの勝者と敗者','互いに命の恩人'],
  },
  emotion: {
    label: '感情 (Emotion)',
    icon: '💫',
    color: 'yellow',
    items: ['怒り（爆発寸前）','恐怖（何かから逃げている）','悲しみ（喪失直後）','期待（大きな変化の前）','罪悪感（後悔が消えない）','嫉妬（認めたくない）','安堵（最悪を免れた直後）','孤独（群衆の中にいても）','興奮（人生最大の冒険前夜）','諦め（もう何もかも終わり）','希望（絶望の中の一筋の光）','憎しみ（燃えるような）','愛（伝えられない）','退屈（すべてが同じに見える）','混乱（何が現実かわからない）','無気力（何もしたくない）','焦り（時間が足りない）','驚き（信じられない発見）','幸福感（今この瞬間が完璧）','解放感（長い縛りから自由に）','痛み（身体的または精神的）','誇り（達成の頂点）','恥（取り返しのつかない失態）','欲望（禁じられた何かへの渇望）','怠惰（何かから逃げている）','懐かしさ（もう戻れない過去）','執念（絶対に諦めない）','困惑（全てが意味をなさない）','羨望（持っていないものへの渇望）','燃え尽き感（もう戦えない）'],
  },
  prop: {
    label: '小道具 (Prop)',
    icon: '🎁',
    color: 'orange',
    items: ['壊れた時計','燃えかけた手紙','鍵（どの鍵穴にも合わない）','汚れた子供の靴','読めない言語の本','折れた剣','見知らぬ人の写真','半分残った薬瓶','黄金のコイン（偽物かもしれない）','古い地図（一部が消えている）','一輪の造花','割れた鏡','誰かの日記','消えかけた指輪の刻印','使用済み切符','謎の箱（開け方がわからない）','一本だけ残った矢','宛先不明の手紙','半分燃えた本','錆びた鍵束','割れた人形','金庫の中の空の袋','古い演奏家の楽器','使用済みの許可証','消えかけたタトゥー','誰かの骨（一本）','消えない血の染み','半分ちぎれた地図','閉じない本','燃えない紙'],
  },
  conflict: {
    label: 'コンフリクト (Conflict)',
    icon: '⚡',
    color: 'red',
    items: ['二人のうち一人しか生き残れない','嘘をつき続けなければならない','過去に戻ることはできない','信じていた人が実は敵だった','助けることで自分が壊れていく','選択するたびに誰かが傷つく','真実を言えば全てが終わる','記憶が消えていく中での決断','愛する人が敵の側にいる','扉を開けたら何かが入ってくる','全てを手放さないと前に進めない','今この瞬間が最後かもしれない','正しいことと必要なことが逆','約束を守ることが誰かを殺す','逃げることは別の誰かを殺すことを意味する','二つの命のうちどちらを選ぶ','告白することが世界を変える','黙っていることが最善かもしれない','一方がもう一方の秘密を知った','正体を明かしたら全てが変わる','手遅れになる前に何かを渡さなければならない','二人の間に深すぎる誤解がある','一方が全てを知っていたと判明する','逃げ場がなくなった','共通の目標が実は相反している','自分が原因だと気づいた','全てを失ってでも続けるか','一方が引き返せない決断をした','嘘が真実になってしまった','守るために捨てなければならない'],
  },
};

let scene = {};
let customItems = JSON.parse(localStorage.getItem('improv_custom') || '{}');
let favorites = JSON.parse(localStorage.getItem('improv_favs') || '[]');
let editingKey = null;

// Merge custom
Object.keys(customItems).forEach(k => {
  if (ELEMENTS[k]) ELEMENTS[k].items = [...ELEMENTS[k].items, ...customItems[k]];
});

function rand(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

function rollAll() {
  Object.keys(ELEMENTS).forEach(k => { scene[k] = rand(ELEMENTS[k].items); });
  renderCards();
}

function rerollSingle(key) {
  scene[key] = rand(ELEMENTS[key].items);
  renderCards();
}

function renderCards() {
  const container = document.getElementById('scene-cards');
  container.innerHTML = Object.keys(ELEMENTS).map(k => {
    const el = ELEMENTS[k];
    const val = scene[k] || '—';
    const colorMap = { teal: 'text-teal-300 bg-teal-900/40', blue: 'text-blue-300 bg-blue-900/40', purple: 'text-purple-300 bg-purple-900/40', yellow: 'text-yellow-300 bg-yellow-900/40', orange: 'text-orange-300 bg-orange-900/40', red: 'text-red-300 bg-red-900/40' };
    const cm = colorMap[el.color];
    return `
      <div class="bg-gray-800 rounded-xl p-4 flex items-start gap-3">
        <span class="text-2xl">${el.icon}</span>
        <div class="flex-1">
          <div class="text-xs font-semibold ${cm.split(' ')[0]} mb-1">${el.label}</div>
          <div class="text-base font-medium text-white">${esc(val)}</div>
        </div>
        <div class="flex gap-1">
          <button onclick="rerollSingle('${k}')" class="text-gray-500 hover:text-teal-400 text-sm px-2" aria-label="${el.label}を再ロール">🎲</button>
          <button onclick="openEdit('${k}')" class="text-gray-500 hover:text-blue-400 text-sm px-2" aria-label="${el.label}リスト編集">✏️</button>
        </div>
      </div>
    `;
  }).join('');

  // Save & favorite button
  container.innerHTML += `
    <div class="flex gap-2">
      <button onclick="saveToFavs()" class="flex-1 bg-yellow-700 hover:bg-yellow-600 text-white font-semibold py-2 rounded-lg text-sm" aria-label="お気に入りに保存">★ お気に入りに保存</button>
    </div>
  `;
}

function openEdit(key) {
  editingKey = key;
  document.getElementById('edit-title').textContent = `${ELEMENTS[key].icon} ${ELEMENTS[key].label} のリストを編集`;
  document.getElementById('edit-area').value = ELEMENTS[key].items.join('\n');
  document.getElementById('edit-modal').classList.remove('hidden');
}

function saveEdit() {
  if (!editingKey) return;
  const lines = document.getElementById('edit-area').value.split('\n').map(l => l.trim()).filter(l => l);
  ELEMENTS[editingKey].items = lines;
  if (!customItems[editingKey]) customItems[editingKey] = [];
  customItems[editingKey] = lines.filter(l => !ELEMENTS[editingKey].items.includes(l));
  localStorage.setItem('improv_custom', JSON.stringify(customItems));
  document.getElementById('edit-modal').classList.add('hidden');
  if (scene[editingKey]) renderCards();
}

function saveToFavs() {
  if (Object.keys(scene).length === 0) return;
  favorites.unshift({ id: Date.now(), scene: { ...scene } });
  if (favorites.length > 10) favorites.pop();
  localStorage.setItem('improv_favs', JSON.stringify(favorites));
  renderFavs();
}

function clearFavs() {
  favorites = [];
  localStorage.removeItem('improv_favs');
  renderFavs();
}

function renderFavs() {
  const list = document.getElementById('favs-list');
  if (favorites.length === 0) { list.innerHTML = '保存なし'; return; }
  list.innerHTML = favorites.map((f, i) => `
    <div class="bg-gray-700 rounded-lg p-3">
      <div class="flex justify-between items-start mb-2">
        <div class="text-xs text-gray-400">シーン ${i + 1}</div>
        <button onclick="removeFav(${i})" class="text-gray-500 hover:text-red-400 text-xs" aria-label="削除">✕</button>
      </div>
      <div class="space-y-0.5 text-xs">
        ${Object.keys(ELEMENTS).map(k => `<div class="text-gray-300">${ELEMENTS[k].icon} ${f.scene[k] || '—'}</div>`).join('')}
      </div>
      <button onclick="loadFav(${i})" class="mt-2 text-xs text-teal-400 hover:text-teal-300" aria-label="このシーンを読み込む">読み込む →</button>
    </div>
  `).join('');
}

function removeFav(i) {
  favorites.splice(i, 1);
  localStorage.setItem('improv_favs', JSON.stringify(favorites));
  renderFavs();
}

function loadFav(i) {
  scene = { ...favorites[i].scene };
  renderCards();
}

renderCards();
renderFavs();
</script>
</body>
</html>
